name: build

# 触发条件:
#   1. 推送 v* 标签(自动发版)
#   2. push 到 main(校验配置能跑通,产物不发布)
#   3. 手动触发(workflow_dispatch)
on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write   # 创建 GitHub Release 需要

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Linux 上 PyQt5 5.15 需要一些 X11 / OpenGL 系统库
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-xinerama0 libxcb-cursor0 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-sync1 libxcb-xfixes0 \
            libxcb-xkb1 libxcb-render0 libfontconfig1 libdbus-1-3 \
            libxrandr2 libxkbcommon0 libegl1 libgl1 libxshmfence1 \
            libglib2.0-0 libnss3 libxss1 libasound2t64

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            %LOCALAPPDATA%\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build (PyInstaller)
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            pyinstaller flashai.spec --noconfirm --clean
          else
            chmod +x build.sh
            ./build.sh
          fi

      - name: Locate output
        id: locate
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            EXE_PATH="dist/智能助手/智能助手.exe"
            ARCHIVE_DIR="dist/智能助手"
            ARTIFACT_NAME="FlashAI-Windows-x64"
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            EXE_PATH="dist/FlashAI/FlashAI"
            ARCHIVE_DIR="dist/FlashAI"
            ARTIFACT_NAME="FlashAI-macOS-${{ runner.arch }}"
          else
            EXE_PATH="dist/flashai/flashai"
            ARCHIVE_DIR="dist/flashai"
            ARTIFACT_NAME="FlashAI-Linux-x64"
          fi
          echo "exe=$EXE_PATH" >> "$GITHUB_OUTPUT"
          echo "dir=$ARCHIVE_DIR" >> "$GITHUB_OUTPUT"
          echo "name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

      - name: Zip artifact
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a -tzip "${{ steps.locate.outputs.name }}.zip" "${{ steps.locate.outputs.dir }}/*"
          else
            zip -r "${{ steps.locate.outputs.name }}.zip" "${{ steps.locate.outputs.dir }}"
          fi

      - name: Upload artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.locate.outputs.name }}
          path: ${{ steps.locate.outputs.name }}.zip
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
